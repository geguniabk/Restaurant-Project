<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>შეკვეთა მიღებულია | Foodie</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .confirmation-wrapper {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .confirmation-card {
            max-width: 520px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            border-radius: 16px;
            padding: 50px 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .confirmation-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #df4b37;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .confirmation-icon i {
            color: #ffffff;
            font-size: 2.5rem;
        }

        .confirmation-card h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #222;
        }

        .confirmation-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .confirmation-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .confirmation-actions .btn-primary {
            display: inline-block;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
        }

        .confirmation-actions .btn-secondary {
            display: inline-block;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid #ddd;
            color: #333;
        }

        @media (max-width: 600px) {
            .confirmation-wrapper {
                padding: 40px 15px;
                min-height: 50vh;
            }

            .confirmation-card {
                padding: 35px 22px;
                border-radius: 12px;
            }

            .confirmation-icon {
                width: 70px;
                height: 70px;
                margin-bottom: 18px;
            }

            .confirmation-icon i {
                font-size: 2rem;
            }

            .confirmation-card h1 {
                font-size: 1.4rem;
            }

            .confirmation-card p {
                font-size: 0.95rem;
                margin-bottom: 22px;
            }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="confirmation-wrapper">
        <div class="confirmation-card">
            <div class="confirmation-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>შეკვეთა მიღებულია!</h1>
            <p>მადლობა შეკვეთისთვის. თქვენი შეკვეთა წარმატებით გაფორმდა და მალე მომზადებას დაიწყებს. დეტალები გამოგზავნილია თქვენს ელფოსტაზე.</p>
            <div class="confirmation-actions">
                <a href="menu.html" class="btn-primary">მენიუში დაბრუნება</a>
                <a href="index.html" class="btn-secondary">მთავარ გვერდზე დაბრუნება</a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/config.js"></script>
    <script src="js/assistant.js"></script>
    <script src="js/header.js"></script>
</body>
</html>
