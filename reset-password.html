<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პაროლის აღდგენა | Foodie</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .reset-wrapper {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .reset-card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .reset-card h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #222;
            text-align: center;
        }

        .reset-card p.hint {
            color: #777;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .reset-card .input-group {
            margin-bottom: 18px;
        }

        .reset-card label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #333;
        }

        .reset-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .reset-card input:focus {
            border-color: #df4b37;
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="reset-wrapper">
        <div class="reset-card">
            <h1>ახალი პაროლის დაყენება</h1>
            <p class="hint">შეიყვანეთ ახალი პაროლი თქვენი ანგარიშისთვის</p>

            <div id="reset-message" class="message"></div>

            <form id="reset-password-form">
                <div class="input-group">
                    <label for="new-password">ახალი პაროლი</label>
                    <input type="password" id="new-password" autocomplete="new-password" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="confirm-password">გაიმეორეთ პაროლი</label>
                    <input type="password" id="confirm-password" autocomplete="new-password" required minlength="6">
                </div>
                <button type="submit" class="btn-primary w-100">პაროლის განახლება</button>
            </form>

            <p style="text-align:center; margin-top:16px;">
                <a href="index.html" style="font-size:0.85rem; color:#777;">მთავარ გვერდზე დაბრუნება</a>
            </p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/config.js"></script>
    <script src="js/assistant.js"></script>
    <script src="js/header.js"></script>
    <script src="js/reset-password.js"></script>

</body>
</html>
